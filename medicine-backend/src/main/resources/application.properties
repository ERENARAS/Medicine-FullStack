spring.application.name=medicine

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://db:3306/medicine_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:medicine_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:medicine_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
